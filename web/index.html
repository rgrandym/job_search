<!doctype html>
<html lang="en" data-theme="claude-light" data-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Job Search</title>
    <script>
      // Apply the saved theme before the first paint (Claude Light is the default). Keep the
      // dark ids in step with src/lib/themes.ts.
      try {
        const dark = ["claude-dark", "kraft", "slate", "colorblind-dark", "contrast-dark", "charcoal", "charcoal-colorblind-dark", "research-dark-cb"];
        const old = localStorage.getItem("jobsearch.theme.v2");
        const theme = localStorage.getItem("jobsearch.theme.v3") || (old === "dark" ? "claude-dark" : "");
        if (theme) {
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.scheme = dark.includes(theme) ? "dark" : "light";
        }
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
