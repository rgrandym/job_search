# Model comparison plan, run by /compare_models
# (python -m src.services.model_compare --config model_compare.toml).
#
# Each setup re-screens the SAME labelled jobs and is scored against your labels. It calls the
# model for every job: comment out setups you do not need.
#
# Claude only (user's decision 2026-11-22: OpenAI/Codex models are no longer used).

# "labels": every job you labelled Would apply or No in the app (Maybe is left out), judged
# with the profile, filters and threshold stored with the label. 133 labels (28 yes / 105 no)
# in 16 groups: about 50 first-pass calls plus second opinions per setup.
# "history": past verdicts instead (uses `sample` and `baseline` below).
reference = "labels"

# Learning from your labels ("Your labels" > Suggest profile updates):
# learned = true applies the preferences you accepted to each label's profile, to measure
# what they change on the same labels (run once with false, once with true).
learned = false
# labels_since = 2026-10-10

# threshold scores every label at this listing floor instead of the 60 stored with it.
# Real searches now run at 50 for next-level and adjacent roles (user's setting, 2026-11-22),
# so 60 measured a cut-off that is not in use: at 60 the screener ranked the good jobs well
# (96%) but the floor sliced through the middle of them.
threshold = 50

# A balanced sample: at most this many "yes" and "no" labels, drawn from the largest label
# groups first. 20/20 = 40 labels in 5 groups, about 13 min per setup (all 5 in ~1.1 h, inside
# one plan window); the full 133 labels take ~30 min per setup. Balanced because the metric
# that matters is the good jobs a setup keeps, and the real 28/105 split starves it.
# Remove both to score every label.
max_yes = 20
max_no = 20

# History reference only: postings re-screened per setup, and which past searches count.
sample = 24
baseline = []

# Two ways to write a setup (the quality model gives the second opinions):
#   "screening:effort/quality:effort"   runs on the provider chosen in Settings
#   { provider = "...", screening = "model:effort", quality = "model:effort" }
# Efforts: low, medium, high, xhigh, max (Haiku has no effort control).
#
# The ladder below holds the second opinions steady (Opus 5.5 medium) and walks the screening
# model up, so the accuracy that screening buys is visible on its own; the first setup is the
# app's current setting, the last the ceiling.
setups = [
    # Round 2 (2026-11-22). Round 1 showed the grader decides: every Opus-grader setup scored
    # 7-8/20, the one Sonnet-grader setup 11/20. So the grader stays Sonnet 5.5 and we chase
    # speed and price on the screening side, where the calls are many.
    #
    # The fast candidate: round 1's Sonnet-low screening ran in 2:49 vs Haiku 4.5's 12:30
    # (Haiku 4.5 ignores --effort and wrote 11k output tokens per call; Sonnet-low wrote 927).
    { provider = "claude_code", screening = "claude-sonnet-5-5:low", quality = "claude-sonnet-5-5:medium" },
    { provider = "claude_code", screening = "claude-sonnet-5-5:medium", quality = "claude-sonnet-5-5:medium" },
    # Haiku 5.5: 10x cheaper than Haiku 4.5 ($0.10/$0.50 vs $1/$5) and it does take an effort
    # level, so the token bloat that made Haiku 4.5 slow is controllable here.
    { provider = "claude_code", screening = "claude-haiku-5-5:low", quality = "claude-sonnet-5-5:medium" },
    { provider = "claude_code", screening = "claude-haiku-5-5:medium", quality = "claude-sonnet-5-5:medium" },
]

# API-equivalent prices, USD per 1M tokens: [input, output]. Claude prices come from the app's
# model catalogue. On Claude Code you pay with plan limits: the "plan" lines show the share used.
[prices]
